name: Prospection B2B (Google Maps -> Excel -> e-mail)
run-name: "${{ contains(github.event.inputs.departements, '77mlv') && 'TAXI Marne-la-Vallee' || 'Cordiste fibrociment' }} (${{ github.event.inputs.departements }})"

# Quand cette recherche est finie, le workflow "Excel final combine" se lance tout seul :
# il fusionne les resultats, complete les e-mails et envoie UN seul Excel.

on:
  workflow_dispatch:
    inputs:
      departements:
        description: "Départements à scraper (JSON)"
        default: '["75","92","93","94","77","78","91","95"]'
      profondeur:
        description: "Profondeur de défilement Google Maps pour Paris et les villes de +15 000 hab. (les petites communes : 3)"
        default: "15"
      duree_max_minutes:
        description: "Durée max de scraping par lot (minutes, max 300)"
        default: "300"
      metiers:
        description: 'Optionnel : seulement ces métiers (JSON, ex. ["architecte"]). Vide = tous les métiers.'
        default: ""
      lots:
        description: 'Optionnel : refaire seulement ces lots (JSON, ex. ["77-p-3","78-g-0"]). Vide = tous.'
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Préparer les lots (toutes les communes)
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.plan.outputs.matrice }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          METIERS: ${{ github.event.inputs.metiers }}
          LOTS: ${{ github.event.inputs.lots }}
        run: |
          DEPS='${{ github.event.inputs.departements || '["75","92","93","94","77","78","91","95"]' }}'
          PROF="${{ github.event.inputs.profondeur || '15' }}"
          echo "matrice=$(python3 scripts/make_queries.py plan "$DEPS" "$PROF" "$METIERS" "$LOTS")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lots
          path: lots/
          retention-days: 3

  scraper:
    name: Scraping ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lots
          path: lots

      - name: Requêtes du lot
        run: |
          mkdir -p out
          cp "lots/${{ matrix.id }}.txt" queries.txt
          wc -l queries.txt

      - name: Scraper Google Maps + e-mails des sites
        run: |
          DUREE="${{ github.event.inputs.duree_max_minutes || '300' }}"
          [ "$DUREE" -gt 300 ] && DUREE=300
          docker pull gosom/google-maps-scraper:latest
          # Le scraper s'arrête seul quand toutes les recherches du lot sont faites (5 min d'inactivité),
          # ou au bout de la durée max : on garde tout ce qui a déjà été trouvé.
          # Arrêt forcé du conteneur à la durée max (sinon un scraper bloqué fait dépasser la limite GitHub
          # et tout le lot est perdu).
          ( sleep "${DUREE}m"; docker kill gms ) >/dev/null 2>&1 &
          GARDE=$!
          timeout -k 1m "$((DUREE + 2))m" docker run --name gms \
            -v "$PWD/queries.txt:/queries.txt:ro" \
            -v "$PWD/out:/out" \
            gosom/google-maps-scraper:latest \
            -input /queries.txt \
            -results /out/resultats-${{ matrix.id }}.csv \
            -depth "${{ matrix.profondeur }}" \
            -email \
            -lang fr \
            -c 4 \
            -resume \
            -exit-on-inactivity 5m || echo "Arrêt (fin ou durée max atteinte)"
          kill "$GARDE" 2>/dev/null || true
          docker kill gms >/dev/null 2>&1 || true
          sudo chown -R "$USER" out || true
          wc -l out/*.csv || true

      # Dépôt public : les résultats sont chiffrés avant d'être transmis à l'étape Excel,
      # personne d'autre ne peut les lire.
      - name: Chiffrer les résultats du département
        if: always()
        env:
          CLE: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # toujours sauver ce qui a été trouvé, même si le scraping a été interrompu
          docker kill gms >/dev/null 2>&1 || true
          mkdir -p out
          sudo chown -R "$USER" out || true
          sudo chmod -R u+rw out || true
          touch out/vide.csv
          tar czf resultats.tgz out/*.csv
          openssl enc -aes-256-cbc -pbkdf2 -salt -in resultats.tgz -out resultats-${{ matrix.id }}.enc -pass env:CLE
          rm -f resultats.tgz

      - name: Transmettre les résultats chiffrés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-${{ matrix.id }}
          path: resultats-${{ matrix.id }}.enc
          retention-days: 5
          if-no-files-found: warn


  annuaire-gouv:
    name: Annuaire officiel des entreprises (data.gouv.fr)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Interroger l'annuaire officiel (INSEE/Sirene)
        run: |
          mkdir -p out
          python scripts/annuaire_gouv.py '${{ github.event.inputs.departements }}' out
          wc -l out/*.csv || true

      - name: Chiffrer les résultats
        if: always()
        env:
          CLE: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p out
          touch out/vide.csv
          tar czf resultats.tgz out/*.csv
          openssl enc -aes-256-cbc -pbkdf2 -salt -in resultats.tgz -out resultats-annuairegouv.enc -pass env:CLE
          rm -f resultats.tgz

      - name: Transmettre les résultats chiffrés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-annuairegouv
          path: resultats-annuairegouv.enc
          retention-days: 5
          if-no-files-found: warn
