name: Prospection cordiste fibrociment (Google Maps -> Excel -> e-mail)

on:
  workflow_dispatch:
    inputs:
      departements:
        description: "Départements à scraper (JSON)"
        default: '["75","92","93","94","77","78","91","95"]'
      profondeur:
        description: "Profondeur de défilement Google Maps pour Paris et les villes de +15 000 hab. (les petites communes : 3)"
        default: "15"
      duree_max_minutes:
        description: "Durée max de scraping par lot (minutes, max 330)"
        default: "320"

permissions:
  contents: read

jobs:
  plan:
    name: Préparer les lots (toutes les communes)
    runs-on: ubuntu-latest
    outputs:
      matrice: ${{ steps.plan.outputs.matrice }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          DEPS='${{ github.event.inputs.departements || '["75","92","93","94","77","78","91","95"]' }}'
          PROF="${{ github.event.inputs.profondeur || '15' }}"
          echo "matrice=$(python3 scripts/make_queries.py plan "$DEPS" "$PROF")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lots
          path: lots/
          retention-days: 3

  scraper:
    name: Scraping ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrice) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lots
          path: lots

      - name: Requêtes du lot
        run: |
          mkdir -p out
          cp "lots/${{ matrix.id }}.txt" queries.txt
          wc -l queries.txt

      - name: Scraper Google Maps + e-mails des sites
        run: |
          DUREE="${{ github.event.inputs.duree_max_minutes || '320' }}"
          docker pull gosom/google-maps-scraper:latest
          # Le scraper s'arrête seul quand toutes les recherches du lot sont faites (5 min d'inactivité),
          # ou au bout de la durée max : on garde tout ce qui a déjà été trouvé.
          timeout "${DUREE}m" docker run --name gms \
            -v "$PWD/queries.txt:/queries.txt:ro" \
            -v "$PWD/out:/out" \
            gosom/google-maps-scraper:latest \
            -input /queries.txt \
            -results /out/resultats-${{ matrix.id }}.csv \
            -depth "${{ matrix.profondeur }}" \
            -email \
            -lang fr \
            -c 4 \
            -resume \
            -exit-on-inactivity 5m || echo "Arrêt (fin ou durée max atteinte)"
          docker stop gms >/dev/null 2>&1 || true
          sudo chown -R "$USER" out || true
          wc -l out/*.csv || true

      # Dépôt public : les résultats sont chiffrés avant d'être transmis à l'étape Excel,
      # personne d'autre ne peut les lire.
      - name: Chiffrer les résultats du département
        if: always()
        env:
          CLE: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          touch out/vide.csv
          tar czf resultats.tgz out/*.csv
          openssl enc -aes-256-cbc -pbkdf2 -salt -in resultats.tgz -out resultats-${{ matrix.id }}.enc -pass env:CLE
          rm -f resultats.tgz

      - name: Transmettre les résultats chiffrés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-${{ matrix.id }}
          path: resultats-${{ matrix.id }}.enc
          retention-days: 1
          if-no-files-found: warn

  excel-et-email:
    name: Excel + envoi par e-mail
    needs: scraper
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les résultats de tous les départements
        uses: actions/download-artifact@v4
        with:
          path: resultats
          pattern: resultats-*

      - name: Déchiffrer
        env:
          CLE: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p csv
          for f in $(find resultats -name '*.enc'); do
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -pass env:CLE | tar xzf - -C csv
          done
          find csv -name '*.csv' -size +0 | xargs -r wc -l

      - name: Compléter les e-mails manquants (sites web + moteurs de recherche)
        run: |
          pip install openpyxl==3.1.5 requests==2.32.3
          mkdir -p enrichi
          python scripts/enrich.py csv enrichi/resultats-enrichis.csv 300

      - name: Construire le fichier Excel (sans doublons)
        run: |
          FICHIER="prospects-cordiste-fibrociment-IDF-$(date +%Y-%m-%d).xlsx"
          echo "FICHIER=$FICHIER" >> "$GITHUB_ENV"
          python scripts/build_excel.py enrichi "$FICHIER"
          echo "### Résultat" >> "$GITHUB_STEP_SUMMARY"
          cat stats.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer l'Excel par e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/send_email.py "$FICHIER"
