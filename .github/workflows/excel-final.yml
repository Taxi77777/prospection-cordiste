name: Excel final combiné (toutes les recherches -> un seul fichier sans doublon)

# Se lance tout seul quand une recherche se termine. Si d'autres recherches tournent encore,
# il ne fait rien : c'est la dernière qui déclenche le fichier final.
# Il reprend les résultats (chiffrés) de toutes les recherches réussies des 36 dernières heures,
# les fusionne, complète les e-mails manquants, dédoublonne et envoie UN seul Excel.
on:
  workflow_run:
    workflows: ["Prospection B2B (Google Maps -> Excel -> e-mail)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      campagne:
        description: "Campagne à fusionner : cordiste / taxi / assurance"
        type: choice
        options: [cordiste, taxi, assurance]
        default: cordiste
      runs:
        description: "Optionnel : id des recherches à fusionner, séparés par des espaces (vide = automatique)"
        default: ""
      minutes_enrichissement:
        description: "Temps max pour compléter les e-mails manquants (minutes, max 300)"
        default: "300"

permissions:
  contents: read
  actions: read

concurrency:
  group: excel-final
  cancel-in-progress: true

jobs:
  verifier:
    name: Toutes les recherches sont-elles finies ?
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.v.outputs.runs }}
      campagne: ${{ steps.v.outputs.campagne }}
    steps:
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ github.event.inputs.runs }}
          CAMPAGNE_IN: ${{ github.event.inputs.campagne }}
          TITRE_DECLENCHEUR: ${{ github.event.workflow_run.display_title }}
        run: |
          # Campagne : choisie a la main, sinon deduite du titre de la recherche qui vient de finir
          C="$CAMPAGNE_IN"
          if [ -z "$C" ]; then
            case "$TITRE_DECLENCHEUR" in
              ASSURANCE*) C=assurance ;;
              TAXI*) C=taxi ;;
              *) C=cordiste ;;
            esac
          fi
          echo "campagne=$C" >> "$GITHUB_OUTPUT"
          export C
          if [ -n "$RUNS" ]; then echo "runs=$RUNS" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh run list -R "$GITHUB_REPOSITORY" -w prospection.yml -L 30 \
            --json databaseId,status,conclusion,createdAt,displayTitle > runs.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime, os
          PREFIXE = {"assurance": "ASSURANCE", "taxi": "TAXI", "cordiste": "Cordiste"}[os.environ["C"]]
          # on ne fusionne que les recherches de la meme campagne (jamais assurance + cordiste melanges)
          runs = [r for r in json.load(open("runs.json")) if r.get("displayTitle", "").startswith(PREFIXE)]
          now = datetime.datetime.now(datetime.timezone.utc)
          recent = [r for r in runs if now - datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) < datetime.timedelta(hours=36)]
          en_cours = [r for r in recent if r["status"] != "completed"]
          # "cancelled" = un lot a depasse le temps max : les autres lots sont bons, on les garde.
          # Recherches a ne jamais reprendre (ancienne liste de metiers) :
          IGNORER = {"35882540366", "40679912836", "40680693644"}
          ok = [str(r["databaseId"]) for r in recent if r["status"] == "completed"
                and r["conclusion"] in ("success", "failure", "cancelled") and str(r["databaseId"]) not in IGNORER]
          if en_cours:
              print("runs=")  # une recherche tourne encore : c'est elle qui lancera le fichier final
          else:
              print("runs=" + " ".join(ok))
          EOF
          cat "$GITHUB_OUTPUT"

  excel-final:
    name: Fusion + Excel + e-mail
    needs: verifier
    if: needs.verifier.outputs.runs != ''
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les résultats des recherches
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ needs.verifier.outputs.runs }}
        run: |
          mkdir -p resultats
          for id in $RUNS; do
            echo "Recherche $id"
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'resultats-*' -D "resultats/$id" || echo "  rien récupéré pour $id"
          done
          find resultats -name '*.enc' | wc -l

      - name: Déchiffrer
        env:
          CLE: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          mkdir -p csv
          n=0
          for f in $(find resultats -name '*.enc'); do
            n=$((n+1))
            mkdir -p "csv/$n"
            openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -pass env:CLE | tar xzf - -C "csv/$n"
          done
          find csv -name '*.csv' -size +0 | xargs -r wc -l | tail -1

      - name: Compléter les e-mails manquants (sites web + moteurs de recherche)
        run: |
          pip install openpyxl==3.1.5 requests==2.32.3
          mkdir -p enrichi
          python -u scripts/enrich.py csv enrichi/resultats-enrichis.csv "${{ github.event.inputs.minutes_enrichissement || '300' }}"

      - name: Construire le fichier Excel (sans doublons)
        run: |
          case "${{ needs.verifier.outputs.campagne }}" in
            assurance) NOM="prospects-assurances-assistance-taxi" ;;
            taxi) NOM="prospects-taxi-marne-la-vallee" ;;
            *) NOM="prospects-cordiste-fibrociment-IDF" ;;
          esac
          FICHIER="$NOM-FINAL-$(date +%Y-%m-%d).xlsx"
          echo "FICHIER=$FICHIER" >> "$GITHUB_ENV"
          python scripts/build_excel.py enrichi "$FICHIER"
          echo "### Résultat" >> "$GITHUB_STEP_SUMMARY"
          cat stats.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Envoyer l'Excel par e-mail
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_TITRE: "FICHIER FINAL COMBINE"
          MAIL_SUJET: ${{ needs.verifier.outputs.campagne == 'assurance' && 'Prospects assurances / assisteurs (taxi)' || (needs.verifier.outputs.campagne == 'taxi' && 'Prospects Taxi Marne-la-Vallee' || 'Prospects cordiste fibrociment IDF') }}
        run: python scripts/send_email.py "$FICHIER"
